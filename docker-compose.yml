services:
  postgres:
    image: postgres:16-alpine
    container_name: healtrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healtrip
      POSTGRES_PASSWORD: healtrip
      POSTGRES_DB: healtrip
    ports:
      - "5432:5432"
    volumes:
      - healtrip_pgdata:/var/lib/postgresql/data

volumes:
  healtrip_pgdata:
